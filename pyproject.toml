[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-xray-audit"
version = "0.1.0"
description = "Research tools for evaluating chest X-ray classifiers across datasets"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
dataset-preflight = "chest_xray_audit.preflight:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
